[workspace]
resolver = "3"
members = ["crates/anb-core", "crates/anb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Not a compatibility promise until the first public release; bump freely.
rust-version = "1.98"

[workspace.dependencies]
anb-core = { path = "crates/anb-core" }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
jiff = "0.2"
# preserve_order lands reply keys in insertion order, so `ok` leads every object.
serde_json = { version = "1.0", features = ["preserve_order"] }
proptest = "1.11"
insta = "1.48"
tempfile = "3.27"

# The CLI is a binary that ships, not one that builds fast. `panic = "abort"`
# is the one setting with semantics: a panic ends the process on the spot,
# so nothing here may rely on unwinding or `catch_unwind`, and the shell
# sees a signal rather than an exit code. The panic message, with the file
# and line it names, still prints.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# git-cliff renders CHANGELOG.md from the conventional commits between tags:
#   pnpm dlx git-cliff --tag v<version> -o CHANGELOG.md
[workspace.metadata.git-cliff.changelog]
header = """
# Changelog

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = """

{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/maksimyaromin/agent-notebook/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/maksimyaromin/agent-notebook/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/maksimyaromin/agent-notebook/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[workspace.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# A squash merge leaves the pull request number on the subject; it becomes a link.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/maksimyaromin/agent-notebook/pull/${2}))" },
]
# The hidden comment orders the groups; striptags drops it from the heading.
commit_parsers = [
  { message = '^[^\n]*(?i:grill|lavish|opus|tasks-axi|review pause|self code review|code review runs|preamble|authoring rule|working-docs|field-test questions)', skip = true },
  { message = '^[^\n]*\bADR\b', skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
