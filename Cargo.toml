[workspace]
resolver = "3"
members = ["crates/anb-core", "crates/anb"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# Not a compatibility promise until the first public release; bump freely.
rust-version = "1.98"

[workspace.dependencies]
anb-core = { path = "crates/anb-core" }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
jiff = "0.2"
# preserve_order lands reply keys in insertion order, so `ok` leads every object.
serde_json = { version = "1.0", features = ["preserve_order"] }
proptest = "1.11"
insta = "1.48"
tempfile = "3.27"

# The CLI is a binary that ships, not one that builds fast. `panic = "abort"`
# is the one setting with semantics: a panic ends the process on the spot,
# so nothing here may rely on unwinding or `catch_unwind`, and the shell
# sees a signal rather than an exit code. The panic message, with the file
# and line it names, still prints.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
